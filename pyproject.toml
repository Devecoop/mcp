[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devecoop-mcp"
version = "0.1.0"
description = "Local MCP server that answers questions from the Devecoop GitLab wiki with verifiable citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Devecoop" }]
keywords = ["mcp", "model-context-protocol", "wiki", "search", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp==2.3.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage = "https://github.com/Devecoop/mcp"
Repository = "https://github.com/Devecoop/mcp"
Issues = "https://github.com/Devecoop/mcp/issues"

[project.scripts]
devecoop-mcp = "devecoop_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devecoop_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["devecoop_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
